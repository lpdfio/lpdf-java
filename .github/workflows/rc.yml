name: Release candidate
run-name: "RC ${{ github.event.client_payload.version }}: build and test, no publish"

# Answers core's `core-rc` dispatch for a vX.Y.0-rc.N tag (Lpdf-devcycle.md
# §4.2 in lpdfio/lpdf). Builds and tests this repo's main against the RC
# engine and keeps the jar as a run artifact. Publishes nothing: no Maven
# Central, no tag, no changelog, no GitHub Release, and no publishing secret is
# used. release.yml stays the only path to Maven Central.

on:
  repository_dispatch:
    types: [core-rc]

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, for "Unreleased commits"

      # ── Resolve version ──────────────────────────────────────────────────────
      # The payload is the core RC tag itself. Unlike release.yml, nothing is
      # derived from it: stripping the last number of v0.17.0-rc.1 would give
      # v0.17.0-rc.0.
      - name: Resolve version
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if ! echo "$PAYLOAD_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.0-rc\.[0-9]+$'; then
            echo "::error::Expected a core release-candidate tag like v0.17.0-rc.1, got '$PAYLOAD_VERSION'"
            exit 1
          fi
          echo "CORE_TAG=$PAYLOAD_VERSION"          >> "$GITHUB_ENV"
          echo "FINAL_TAG=${PAYLOAD_VERSION%-rc.*}" >> "$GITHUB_ENV"

      # ── Download WASI binary from the RC pre-release ─────────────────────────
      # No fallback: a test against any other engine proves nothing about this RC.
      - name: Download lpdf-wasi.wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf-wasi.wasm" \
              --dir wasm \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download core RC $CORE_TAG."
            exit 1
          fi
          mv wasm/lpdf-wasi.wasm wasm/lpdf.wasm   # Endive's plugin compiles wasm/lpdf.wasm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The check below is a Node script.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ── Check the API against the schema ─────────────────────────────────────
      # The attribute classes and constants follow from schema/lpdf.xsd, and the scripts that check
      # them live in core. Fails if a generated file differs from what the schema gives, or a class
      # has other attributes than the schema's element.
      # The schema is the one at the RC tag, which this engine ships with.
      - name: Check the API against the schema
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$CORE_TAG" \
            https://github.com/lpdfio/lpdf.git _schema
          git -C _schema sparse-checkout set schema scripts
          node _schema/scripts/gen-sdk-api.mjs --check --sdk java=.
          node _schema/scripts/check-sdk-parity.mjs --sdk java=.
          rm -rf _schema

      # ── Fetch test fixtures and snapshots from core ──────────────────────────
      # At the RC tag, so the golden snapshots match the engine under test.
      - name: Fetch test fixtures and snapshots from core
        run: |
          git clone --depth 1 --branch "$CORE_TAG" --filter=blob:none --sparse \
            https://github.com/lpdfio/lpdf.git _core
          git -C _core sparse-checkout set test/fixtures test/snapshots
          mkdir -p test/fixtures test/snapshots
          cp -r _core/test/fixtures/. test/fixtures/
          cp -r _core/test/snapshots/. test/snapshots/
          rm -rf _core

      # ── Build, test and keep the jar ─────────────────────────────────────────
      # The pom's version stays the repo's placeholder: this jar is for
      # inspection only, never for a registry.
      - name: Build and test
        run: mvn -B verify

      - name: Upload the jar
        uses: actions/upload-artifact@v6
        with:
          name: rc-${{ env.CORE_TAG }}
          path: target/lpdf-*.jar
          retention-days: 14

      # ── The release jars ─────────────────────────────────────────────────────
      # The release profile on the RC's engine, as release.yml builds it, without signing: the sources
      # jar, and the Javadoc jar with doclint. After the upload, so that the artifact keeps the one jar:
      # target/lpdf-*.jar would take these two too.
      - name: Build the release jars
        run: mvn -B -P release verify -Dgpg.skip -DskipTests

      # The sources jar holds no compiled classes, and the main jar holds the compiled engine.
      - name: Check the release jars
        run: sh scripts/check-release-jars.sh

      # ── What ships from this repo ────────────────────────────────────────────
      # The final core release publishes this repo's main as it stands. Anything
      # on main since the last release tag ships in FINAL_TAG with only core's
      # release notes (Lpdf-devcycle.md §4.1). Runs even if the build or tests
      # failed. Skips the bots' own "changelog: …" commits.
      - name: Unreleased commits
        if: always()
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          COMMITS=""
          if [ -n "$LAST" ]; then
            COMMITS=$(git log --oneline --no-merges --invert-grep \
              --grep='^changelog: ' --grep='^release: ' "$LAST..HEAD")
          fi
          {
            echo "### $REPO: release candidate $CORE_TAG"
            echo
            if [ -z "$LAST" ]; then
              echo "No release tag in this repo yet."
            elif [ -z "$COMMITS" ]; then
              echo "Nothing unreleased since $LAST. $FINAL_TAG changes only the engine."
            else
              echo "Unreleased since $LAST. These ship in $FINAL_TAG, with only core's release notes:"
              echo
              echo '```'
              echo "$COMMITS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COMMITS" ]; then
            echo "::notice::$(echo "$COMMITS" | wc -l | tr -d ' ') unreleased commit(s) since $LAST will ship in $FINAL_TAG"
          fi
